<script>
function updateTime() {
  const n = new Date();
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const timeStr = `${n.getDate()} ${months[n.getMonth()]}, ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  document.getElementById('updated-time').textContent = 'Updated ' + timeStr;
}
updateTime();
setInterval(updateTime, 60000);

function guessType(t) {
  const s = t.toLowerCase();
  if (s.includes('workshop') || s.includes('fest') || s.includes('seminar')) return 'event';
  if (s.includes('admission') || s.includes('selection') || s.includes('eoi') || s.includes('interview') || s.includes('notice') || s.includes('defence')) return 'notice';
  return 'news';
}

// BETTER IMAGE EXTRACTION - Find image CLOSEST to the news item
function extractImageForItem(articleElement, baseUrl) {
  console.log('Extracting image for article...');
  
  // Strategy 1: Look for img INSIDE this specific article only
  const imgs = articleElement.querySelectorAll('img');
  for (let img of imgs) {
    let src = img.src || img.getAttribute('data-src') || img.getAttribute('data-lazy-src');
    if (src && src.trim()) {
      src = src.trim();
      // Skip logos and common images
      if (src.includes('logo') || src.includes('icon') || src.includes('ku-logo')) continue;
      
      if (src.startsWith('/')) src = baseUrl + src;
      else if (src.startsWith('./')) src = baseUrl + src.substring(1);
      else if (!src.startsWith('http') && !src.startsWith('data:')) src = baseUrl + '/' + src;
      
      console.log('✓ Found article image:', src);
      return src;
    }
  }
  
  // Strategy 2: Look for image in a sibling or nearby element
  const parent = articleElement.parentElement;
  if (parent) {
    const nearbyImgs = parent.querySelectorAll('img');
    for (let img of nearbyImgs) {
      let src = img.src;
      if (src && !src.includes('logo') && !src.includes('icon')) {
        console.log('✓ Found nearby image:', src);
        return src;
      }
    }
  }
  
  console.log('✗ No unique image found for this article');
  return null;
}

function parseItems(html, baseUrl = 'https://ku.edu.np') {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const items = [];
  const seen = new Set();
  
  console.log('=== PARSING NEWS ITEMS ===');
  
  // Find all news article containers - be more specific
  const articleSelectors = [
    '.news-item',
    '.article-item', 
    '.post',
    '.entry',
    '[class*="news-card"]',
    '[class*="article-card"]'
  ];
  
  let articles = [];
  for (let selector of articleSelectors) {
    const found = doc.querySelectorAll(selector);
    if (found.length > 0) {
      articles = Array.from(found);
      console.log(`Found ${articles.length} articles using selector: ${selector}`);
      break;
    }
  }
  
  // If no specific containers found, try to find by structure
  if (articles.length === 0) {
    console.log('Trying fallback parsing method...');
    return parseItemsFallback(doc, html, baseUrl);
  }
  
  articles.forEach((article, index) => {
    console.log(`\n--- Processing article ${index + 1} ---`);
    
    // Find title link within this article
    const titleLink = article.querySelector('h3 a, h2 a, h4 a, .title a, a[href*="/news/"]');
    if (!titleLink) {
      console.log('✗ No title link found');
      return;
    }
    
    const title = titleLink.textContent.trim();
    if (!title || title.length < 10) return;
    if (/^\d{4}-\d{2}-\d{2}/.test(title)) return;
    if (title.toLowerCase().includes('more')) return;
    if (seen.has(title)) return;
    seen.add(title);
    
    console.log('Title:', title.substring(0, 60));
    
    // Extract date from THIS article only
    let dateText = '';
    const dateElements = article.querySelectorAll('.date, .post-date, time, [class*="date"], .publish-date');
    for (let el of dateElements) {
      const text = el.textContent.trim();
      const dateMatch = text.match(/(\d{4}-\d{2}-\d{2}(?:,\s*\w+)?)/);
      if (dateMatch) {
        dateText = dateMatch[1];
        break;
      }
    }
    if (!dateText) {
      const dateMatch = article.textContent.match(/(\d{4}-\d{2}-\d{2}(?:,\s*\w+)?)/);
      if (dateMatch) dateText = dateMatch[1];
    }
    console.log('Date:', dateText);
    
    // Extract description from THIS article
    let desc = '';
    const descEl = article.querySelector('p, .description, .excerpt, .summary');
    if (descEl) {
      desc = descEl.textContent.trim();
      if (desc.length > 200) desc = desc.substring(0, 200) + '...';
    }
    
    // Extract image SPECIFIC to this article
    const image = extractImageForItem(article, baseUrl);
    
    items.push({
      title,
      date: dateText,
      type: guessType(title),
      description: desc,
      fullContent: article.textContent.trim(),
      image: image
    });
    
    console.log('Image:', image ? 'FOUND ✓' : 'NOT FOUND ✗');
  });
  
  console.log('\n=== PARSING COMPLETE ===');
  console.log('Total items parsed:', items.length);
  items.forEach((item, i) => {
    console.log(`${i + 1}. ${item.title.substring(0, 40)}... | Image: ${item.image ? 'YES' : 'NO'}`);
  });
  
  return items.length >= 3 ? items : null;
}

function parseItemsFallback(doc, html, baseUrl) {
  console.log('Using fallback parsing...');
  const items = [];
  const seen = new Set();
  
  // Find all news links
  const links = doc.querySelectorAll('a[href*="/news/"], a[href*="news-app"]');
  
  links.forEach((link, index) => {
    const title = link.textContent.trim();
    if (!title || title.length < 10) return;
    if (/^\d{4}-\d{2}-\d{2}/.test(title)) return;
    if (title.toLowerCase().includes('more')) return;
    if (seen.has(title)) return;
    seen.add(title);
    
    // Find closest parent that looks like a news container
    let parent = link;
    for (let i = 0; i < 6 && parent; i++) {
      if (parent.className && (parent.className.includes('news') || parent.className.includes('article') || parent.className.includes('card'))) {
        break;
      }
      parent = parent.parentElement;
    }
    
    let dateText = '';
    const dateMatch = parent.textContent.match(/(\d{4}-\d{2}-\d{2}(?:,\s*\w+)?)/);
    if (dateMatch) dateText = dateMatch[1];
    
    let desc = '';
    const paragraphs = parent.querySelectorAll('p');
    if (paragraphs.length > 0) {
      desc = paragraphs[0].textContent.trim().substring(0, 200) + '...';
    }
    
    const image = extractImageForItem(parent, baseUrl);
    
    items.push({
      title,
      date: dateText,
      type: guessType(title),
      description: desc,
      fullContent: parent.textContent.trim(),
      image: image
    });
    
    if (items.length >= 10) return;
  });
  
  return items.length >= 3 ? items : null;
}

const KU_NEWS = '/.netlify/functions/fetch-news';

async function loadNews() {
  const timeoutPromise = new Promise((_, reject) => 
    setTimeout(() => reject(new Error('Request timed out')), 10000)
  );
  
  let res;
  try {
    res = await Promise.race([fetch(KU_NEWS), timeoutPromise]);
  } catch (e) {
    throw new Error('Network error: ' + e.message);
  }

  if (!res.ok) throw new Error('Server returned HTTP ' + res.status);
  
  const html = await res.text();
  console.log('Fetched HTML length:', html.length);
  
  const items = parseItems(html, 'https://ku.edu.np');
  
  if (!items || items.length === 0) {
    throw new Error('No news items found');
  }
  
  return { items, html };
}

let featuredIndex = 0;
let carouselInterval = null;
let scrollInterval = null;

function renderNews(result) {
  const featuredContent = document.getElementById('featured-content');
  const dotsContainer = document.getElementById('carousel-dots');
  const listTrack = document.getElementById('news-list-track');
  const tickerInner = document.getElementById('ticker-inner');

  if (!result.success) {
    featuredContent.innerHTML = `<div class="status-msg error-msg">⚠️ ${result.error}</div>`;
    dotsContainer.style.display = 'none';
    return;
  }

  const items = result.items;
  console.log('\n=== RENDERING', items.length, 'NEWS ITEMS ===');
  
  // Render featured slides
  featuredContent.innerHTML = items.map((item, idx) => {
    console.log(`\nFeatured Item ${idx + 1}:`);
    console.log('  Title:', item.title.substring(0, 50));
    console.log('  Image URL:', item.image || 'NONE');
    
    return `
      <div class="featured-slide" style="display: ${idx === 0 ? 'block' : 'none'}">
        <div class="featured-image-wrapper">
          ${item.image 
            ? `<img src="${item.image}" class="featured-image" 
                onerror="console.error('❌ FEATURED IMAGE FAILED:', this.src); this.style.display='none'; this.nextElementSibling.style.display='flex';" 
                alt="${item.title}" crossorigin="anonymous">`
            : ''
          }
          <div class="featured-image-placeholder" style="${item.image ? 'display:none;' : 'display:flex;'}">📄</div>
        </div>
        <div class="featured-content">
          <div class="news-badge">${item.type}</div>
          <div class="featured-title">${item.title}</div>
          <div class="featured-description">${item.fullContent || item.description || 'No description available.'}</div>
          <div class="publish-date">Publish Date <span>${item.date || 'N/A'}</span></div>
        </div>
      </div>
    `;
  }).join('');

  // Render carousel dots
  if (items.length > 1) {
    dotsContainer.style.display = 'flex';
    dotsContainer.innerHTML = items.map((_, idx) => 
      `<div class="dot ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})"></div>`
    ).join('');
  } else {
    dotsContainer.style.display = 'none';
  }

  // Render scrolling list with UNIQUE images for each item
  const duplicatedItems = [...items, ...items];
  listTrack.innerHTML = duplicatedItems.map((item, idx) => {
    const originalIdx = idx % items.length;
    console.log(`\nList Item ${idx + 1} (original ${originalIdx + 1}):`);
    console.log('  Title:', item.title.substring(0, 50));
    console.log('  Image URL:', item.image || 'NONE');
    
    return `
      <div class="news-card">
        <div class="news-thumbnail">
          ${item.image 
            ? `<img src="${item.image}" 
                onerror="console.error('❌ THUMBNAIL IMAGE FAILED:', this.src); this.style.display='none'; this.nextElementSibling.style.display='flex';" 
                alt="${item.title}" crossorigin="anonymous">`
            : ''
          }
          <div class="news-thumbnail-placeholder" style="${item.image ? 'display:none;' : 'display:flex;'}">📄</div>
        </div>
        <div class="news-card-content">
          <div>
            <div class="news-card-title">${item.title}</div>
            <div class="news-card-desc">${item.description || item.title.substring(0, 120) + '...'}</div>
          </div>
          <div class="news-card-date">Publish Date <span>${item.date || 'N/A'}</span></div>
        </div>
      </div>
    `;
  }).join('');

  // Update ticker
  tickerInner.innerHTML = items.map(i => 
    `<span class="ticker-item">${i.title}</span>`
  ).join('') + 
  '<span class="ticker-item">Department of Artificial Intelligence · Kathmandu University · doai.ku.edu.np</span>';

  startFeaturedCarousel(items.length);
  setTimeout(startScrollingQueue, 1000);
}

function goToSlide(index) {
  const slides = document.querySelectorAll('.featured-slide');
  const dots = document.querySelectorAll('.dot');
  
  slides.forEach(slide => slide.style.display = 'none');
  dots.forEach(dot => dot.classList.remove('active'));
  
  slides[index].style.display = 'block';
  dots[index].classList.add('active');
  
  featuredIndex = index;
  resetCarousel();
}

function startFeaturedCarousel(totalItems) {
  if (carouselInterval) clearInterval(carouselInterval);
  carouselInterval = setInterval(() => {
    const nextIndex = (featuredIndex + 1) % totalItems;
    goToSlide(nextIndex);
  }, 10000);
}

function resetCarousel() {
  if (carouselInterval) clearInterval(carouselInterval);
  const totalItems = document.querySelectorAll('.featured-slide').length;
  startFeaturedCarousel(totalItems);
}

function startScrollingQueue() {
  const track = document.getElementById('news-list-track');
  const container = document.querySelector('.news-list-container');
  
  if (scrollInterval) clearInterval(scrollInterval);
  
  let position = 0;
  const cardHeight = track.children.length > 0 ? track.children[0].offsetHeight + 32 : 150;
  const totalItems = track.children.length;
  const originalItems = totalItems / 2;
  
  const scrollSpeed = 2000;
  
  function scrollStep() {
    const maxScroll = (originalItems * cardHeight) - container.clientHeight;
    if (maxScroll <= 0) return;
    
    position += 1;
    if (position >= maxScroll) position = 0;
    
    track.style.transform = `translateY(-${position}px)`;
  }
  
  scrollInterval = setInterval(scrollStep, scrollSpeed / cardHeight);
}

// Initialize
console.log('=== INITIALIZING NEWS SIGNAGE ===');
loadNews()
  .then(data => {
    console.log('=== SUCCESS: Loading news ===');
    renderNews({ success: true, items: data.items, html: data.html });
  })
  .catch(err => {
    console.error('=== ERROR ===', err);
    renderNews({ success: false, error: err.message });
  });

// Refresh every 30 minutes
setInterval(() => {
  loadNews()
    .then(data => renderNews({ success: true, items: data.items, html: data.html }))
    .catch(err => renderNews({ success: false, error: err.message }));
}, 30 * 60 * 1000);
</script>
